# ============================================================================
# UC-ASR: Uncertainty-Conditioned Adaptive Semantic Reranking
# Master configuration for the full research pipeline.
# Every module reads from this file so experiments are fully reproducible.
# ============================================================================

project:
  name: "UC-ASR"
  root: "."
  seeds: [42, 100, 2026]          # multi-seed evaluation
  primary_seed: 42

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  cache_dir: "cache"
  results_dir: "results"
  figures_dir: "results/figures"
  llm_cache_db: "cache/llm_responses.sqlite"
  sbert_emb_cache: "cache/sbert_emb"   # persisted SBERT embedding cache

# ----------------------------------------------------------------------------
# Dataset: McAuley-Lab Amazon Reviews 2023 - Grocery and Gourmet Food
# ----------------------------------------------------------------------------
dataset:
  name: "Grocery_and_Gourmet_Food"
  hf_repo: "McAuley-Lab/Amazon-Reviews-2023"
  hf_review_subset: "raw_review_Grocery_and_Gourmet_Food"
  hf_meta_subset: "raw_meta_Grocery_and_Gourmet_Food"
  # Direct download URLs (primary path; HF datasets is the fallback)
  review_url: "https://mcauleylab.ucsd.edu/public_datasets/data/amazon_2023/raw/review_categories/Grocery_and_Gourmet_Food.jsonl.gz"
  meta_url: "https://mcauleylab.ucsd.edu/public_datasets/data/amazon_2023/raw/meta_categories/meta_Grocery_and_Gourmet_Food.jsonl.gz"
  review_file: "Grocery_and_Gourmet_Food.jsonl.gz"
  meta_file: "meta_Grocery_and_Gourmet_Food.jsonl.gz"

preprocessing:
  n_users_subset: 10000           # deterministic subset of users
  k_core: 5                        # 5-core filtering (users & items >= 5 interactions)
  min_user_interactions: 5
  min_item_interactions: 5
  split: "leave_one_out"           # chronological LOO
  max_ram_gb: 8                    # streaming budget guard
  data_parse_max_bad_frac: 0.01    # abort parse if > this fraction of lines are malformed

# ----------------------------------------------------------------------------
# Retrievers
# ----------------------------------------------------------------------------
retrievers:
  top_k_candidates: 50             # K=50 candidate list per user
  popularity:
    enabled: true
  bpr_mf:
    enabled: true
    dim: 64
    epochs: 50
    lr: 0.01
    reg: 0.0001
    batch_size: 2048
  lightgcn:
    enabled: true
    dim: 64
    n_layers: 3
    epochs: 50
    lr: 0.001
    reg: 0.0001
    batch_size: 2048
  faiss:
    index_type: "IndexFlatIP"
  sbert:
    model: "all-MiniLM-L6-v2"
    profile_max_items: 20          # SBERT/ATM user-profile item cap (most-recent train titles)

# ----------------------------------------------------------------------------
# LLM engine (Think-Before-Recommend)
# ----------------------------------------------------------------------------
llm:
  backend: "hf"                    # "hf" (HuggingFace transformers) or "ollama"
  hf_model: "Qwen/Qwen2.5-3B-Instruct"   # fallback: mistralai/Mistral-7B-Instruct-v0.2
  ollama_model: "qwen2.5:3b"
  ollama_url: "http://localhost:11434"
  gemini_model: "gemini-3.5-flash-lite"   # lite flash = highest free quota + lowest cost; this account's ListModels has gemini-3.5-flash-lite; if 404 run scripts/list_gemini_models.py and pick another e.g. gemini-2.5-flash, gemini-3.5-flash
  gemini_rpm: 10                          # lowered from 15 to stay under the free-tier per-minute limit; raise on paid tier
  gemini_max_retries: 8                   # 429-aware retries need room: a free-tier per-MINUTE limit clears within ~60s, so the GeminiBackend retries up to this many times honouring the server retryDelay before raising
  groq_model: "openai/gpt-oss-20b"   # this account's Groq ListModels has openai/gpt-oss-20b (fast, capable); other options: openai/gpt-oss-120b, qwen/qwen3.8-27b. If 404, run the models-list one-liner and pick one.
  groq_rpm: 30                            # Groq free-tier requests-per-minute throttle; raise on a paid tier
  groq_tpm: 8000                          # Groq free-tier TOKENS-per-minute budget; the token-aware throttle keeps estimated (prompt+max_new) tokens under this in any trailing 60s window so steady-state almost never 429s. Raise on a paid/dev tier.
  groq_max_retries: 8                     # 429-aware retries honouring the Retry-After header before raising (a per-MINUTE limit clears within ~60s)
  cerebras_model: "llama-3.3-70b"        # Cerebras ListModels varies by account; common: llama-3.3-70b, llama3.1-8b, qwen-3-32b. If 404, check https://inference-docs.cerebras.ai models list and pick one.
  cerebras_rpm: 5                         # Cerebras free trial is ~5 requests/min; the shared RPM throttle paces to this.
  cerebras_tpm: 60000                     # per-MINUTE token budget for the rolling throttle; well under the ~1,000,000 tokens/DAY free-trial cap so steady-state almost never 429s. Raise on a paid tier.
  cerebras_max_retries: 8                 # 429-aware retries honouring Retry-After (per-minute limits clear within ~60s)
  load_in_4bit: true               # requires CUDA + bitsandbytes; auto-falls back if unavailable
  dtype: "bfloat16"                # consulted ONLY on the CUDA path; CPU always uses float32 (NIT-2)
  device: "auto"                   # "auto" -> cuda if available else cpu
  max_new_tokens: 768             # raised from 512: score-first prompt reaches the score before truncation
  relevance_min: 1.0
  relevance_max: 5.0
  cache_enabled: true

# ----------------------------------------------------------------------------
# Uncertainty quantification
# ----------------------------------------------------------------------------
uncertainty:
  uaro:
    n_passes: 3                    # N=3 stochastic passes
    temperature: 0.7               # T=0.7
  atm:
    nli_model: "cross-encoder/nli-deberta-v3-base"   # bidirectional NLI entailment
    use_nli: false                 # SBERT is authoritative (design B.6); NLI is an
                                   # OPTIONAL tightening -- off by default so CR is fast
                                   # on CPU. The cr_sbert_only_vs_sbert_nli ablation
                                   # flips this on to compare the two clustering signals.
    sbert_sim_threshold: 0.85      # semantic equivalence clustering threshold
    top_k: 10                      # k for Bayesian top-k threshold
    beta: 0.5                      # latent noise sigma term (sigma_i^2 + beta^2)
    epsilon: 0.1                   # boundary band epsilon for uncertain set

# ----------------------------------------------------------------------------
# Rerankers
# ----------------------------------------------------------------------------
rerankers:
  single_pass:
    n: 1
    temperature: 0.0
  uaro:
    n: 3
    lambda: 0.5                    # weight on uncertainty U
    gamma: 0.3                     # weight on retrieval confidence E
  atm:
    epsilon: 0.1
    batch_size: 10                 # listwise batch m=10
  uc_asr:
    tau_high: 0.75                 # confident gate threshold
    tau_low: 0.40                  # unstable gate threshold
    deep_samples: 2                # +2 verification samples for unstable
    batch_size: 10                 # listwise batch m=10 for ambiguous
    # FinalScore = alpha*R + beta*CR + delta*E - gamma*U  (tuned on val)
    alpha: 1.0
    beta: 0.5
    delta: 0.3
    gamma: 0.5
    tune_on_val: true              # grid-search {tau_high, tau_low} on val (full scale only)

# ----------------------------------------------------------------------------
# Evaluation
# ----------------------------------------------------------------------------
evaluation:
  cutoffs: [10]                    # Recall@10, NDCG@10
  metrics: ["recall", "ndcg", "mrr"]
  methods:
    - "Popularity"
    - "MF"
    - "LightGCN"
    - "SBERT reranker"
    - "Single-pass LLM"
    - "UARO"
    - "ATM-style adaptive"
    - "UC-ASR"
  wilcoxon_baseline: "ATM-style adaptive"   # UC-ASR compared against this
  figure_dpi: 300

# ----------------------------------------------------------------------------
# Scale system: --scale selects an overlay merged onto the base config above.
# All knobs live here (no magic numbers in code). `full` keeps base values.
# If the `scales:` block is missing, load_config must fail loudly (see design B.2).
# ----------------------------------------------------------------------------
scales:
  full: {}                         # base config values are the full-scale experiment
  smoke:
    preprocessing:
      n_users_subset: 6000         # deterministic user subset (large enough that
                                   # a workable set survives 2-core on the sparse
                                   # Grocery category; full scale uses 10000/5-core)
      k_core: 2                    # single threshold; min_user/item derived from it (NIT-3)
    retrievers:
      top_k_candidates: 20         # fewer candidates per user
      bpr_mf: { epochs: 3 }
      lightgcn: { epochs: 3 }
    uncertainty:
      uaro: { n_passes: 3 }        # keep N=3 (cheap under mock LLM)
    llm:
      backend: "mock"              # deterministic mock LLM at smoke scale
    rerankers:
      uc_asr: { tune_on_val: false }     # skip val grid-search at smoke scale
    evaluation:
      figure_dpi: 150                    # faster figure render for smoke; full stays 300
      smoke_max_eval_users: 500          # cap users scored by LLM rerankers in smoke.
                                         # Set above the smoke test-user count so LLM
                                         # methods score the SAME population as the
                                         # retrieval-only baselines (comparable rows);
                                         # the mock LLM keeps this fast. Full scale has
                                         # no cap.
      smoke_max_ablation_users: 40       # tighter cap for the 10 ablations (incl. the
                                         # NLI-on sweep variant) so smoke stays in minutes;
                                         # full scale has no cap (runs all users)

  # --- Kaggle GPU profile: real HF LLM on a single T4/P100, sized for one ~12h session ---
  kaggle:
    preprocessing:
      n_users_subset: 10000      # full user target; survives 5-core on Grocery
      k_core: 5                  # real 5-core (NIT-3 derives min_user/item from this)
    retrievers:
      top_k_candidates: 50       # full K=50 candidate list
      bpr_mf: { epochs: 50 }
      lightgcn: { epochs: 50 }
    uncertainty:
      uaro: { n_passes: 3 }      # N=3 stochastic passes @ T=0.7
    llm:
      backend: "hf"              # REAL HuggingFace model on the Kaggle GPU
      hf_model: "Qwen/Qwen2.5-3B-Instruct"   # switch to mistralai/Mistral-7B-Instruct-v0.2 to compare
      load_in_4bit: true         # CUDA + bitsandbytes available on Kaggle -> 4-bit
      dtype: "bfloat16"          # consulted only on CUDA path
      device: "auto"             # -> cuda on Kaggle
    rerankers:
      uc_asr: { tune_on_val: true }      # grid-search thresholds on val (real run)
    evaluation:
      figure_dpi: 300                    # publication-quality figures
      kaggle_max_eval_users: 300         # 300 eval users on seed 42 fits one ~12h T4
                                         # session (~8-11h); raise across multiple
                                         # sessions since the SQLite cache makes reruns cheap
      kaggle_max_ablation_users: 100     # tighter cap for the 10 ablations

  # --- Kaggle FAST validation profile: a ~1-2h real-LLM smoke/validation run on a
  #     single T4 (50 eval users, seed 42). Its PURPOSE is to validate the LLM path
  #     (GPU + 4-bit Qwen2.5-3B + score-parsing) end-to-end before the full ~8-11h
  #     `kaggle` run, so EVERYTHING ELSE is deliberately shrunk to finish in minutes:
  #       * retriever training is scaled DOWN (2000-user subset, K=50, 10 epochs for
  #         both BPR-MF and LightGCN) so the retrieve stage no longer dominates the
  #         wall-clock -- it completes in minutes, leaving the LLM path as the thing
  #         actually being validated;
  #       * the LLM backend is identical to `kaggle` (real HF Qwen2.5-3B 4-bit
  #         bfloat16), uncertainty keeps N=3 passes, uc_asr keeps tune_on_val, and
  #         figures stay 300-DPI;
  #       * the eval/ablation caps are tiny (50 / 20 users).
  #     This exercises the REAL LLM path on real (small) data without paying for a
  #     50-epoch retriever train on the full 10k-user graph. The full `kaggle`
  #     profile above keeps 10k users / 5-core / 50 epochs for the real experiment.
  kaggle_fast:
    project:
      # kaggle_fast validates on a single seed (42) to finish fast; the full
      # `kaggle` profile keeps all 3 seeds [42,100,2026] for the real experiment
      # via the base project.seeds. deep_merge overlays this project block on the
      # base project, so base primary_seed (42) is preserved and only seeds is
      # overridden -- eval then runs the real Qwen scoring ONCE instead of 3x.
      seeds: [42]
    preprocessing:
      n_users_subset: 2000       # k-core now runs on the FULL dataset FIRST (data_pipeline
                                 # parse_reviews), so the user subset is drawn FROM the
                                 # already-dense 5-core. A 2000-user sample from the core is
                                 # dense and survives the k-core safety-net re-check, giving a
                                 # non-degenerate train/val/test split -- the old collapse that
                                 # forced 10000 (subset-then-kcore on a sparse uniform sample)
                                 # no longer applies. Small subset keeps the 10-epoch retriever
                                 # train fast for this ~1-2h validation profile.
      k_core: 5                  # same real 5-core as kaggle
    retrievers:
      top_k_candidates: 50       # same full K=50 candidate list as kaggle
      bpr_mf: { epochs: 10 }     # shrunk vs kaggle (50) -> retrieve stage in minutes
      lightgcn: { epochs: 10 }   # shrunk vs kaggle (50) -> retrieve stage in minutes
    uncertainty:
      uaro: { n_passes: 3 }      # same N=3 stochastic passes @ T=0.7 as kaggle
    llm:
      backend: "hf"              # same REAL HuggingFace model as kaggle
      hf_model: "Qwen/Qwen2.5-3B-Instruct"
      load_in_4bit: true         # same CUDA + bitsandbytes 4-bit path as kaggle
      dtype: "bfloat16"          # consulted only on CUDA path
      device: "auto"             # -> cuda on Kaggle
    rerankers:
      uc_asr: { tune_on_val: false }     # kaggle_fast is a fast VALIDATION run -> skip the val
                                         # grid-search (it would add a large extra batch of LLM
                                         # calls); the full `kaggle` profile keeps tune_on_val: true
                                         # for the real experiment.
    evaluation:
      figure_dpi: 150                    # validation figures don't need print quality -> faster
                                         # render; the full `kaggle` profile keeps 300 dpi
      kaggle_fast_max_eval_users: 3      # score just 3 users (one seed) purely to confirm the
                                         # real Qwen path emits parseable 1.0-5.0 scores end-to-end
                                         # in a few minutes; full `kaggle` keeps 300 eval users
      kaggle_fast_max_ablation_users: 2  # tiny ablation cap so the validation run finishes fast

  # --- Kaggle UNCERTAINTY-THESIS profile: a feasible-but-sufficient real-LLM run on a
  #     single Kaggle T4, sized to produce publishable uncertainty-method results in one
  #     session WITHOUT the full ~8-11h `kaggle` cost.
  #
  #     PURPOSE: keep everything the UNCERTAINTY mechanism needs valid while cutting the
  #     time sinks. Specifically it PROTECTS the three uncertainty signals ---
  #       * UARO score-variance  : N=3 stochastic passes @ T=0.7 (unchanged);
  #       * ATM cluster-ratio CR : clusters the reasoning TRACES, so reasoning length is
  #                                kept long enough (max_new_tokens=256, NOT ~96) for the
  #                                semantic clustering to be meaningful;
  #       * UC-ASR 3-tier gate   : 150 eval users -> enough population to fill the
  #                                Confident / Ambiguous / Unstable tiers with stable stats.
  #
  #     What it CUTS vs `kaggle` (the real experiment) to be feasible:
  #       * single seed [42] instead of [42,100,2026] (the uncertainty mechanism does not
  #         need multi-seed averaging to be valid);
  #       * 150 eval users instead of 300;
  #       * 3 uncertainty-critical ablations instead of all 10;
  #       * skip the val grid-search (tune_on_val=false) -> saves a full extra LLM pass;
  #       * max_new_tokens 256 instead of 768 -> faster generation while still long enough
  #         for CR trace clustering.
  #     Everything else matches `kaggle`: real HF Qwen2.5-3B 4-bit bfloat16, 10k-user
  #     5-core dense graph, full 50-epoch BPR-MF + LightGCN retriever train, K=50
  #     candidates, and 300-DPI publication figures (fig3 = uncertainty/gate distribution).
  kaggle_unc:
    project:
      seeds: [42]                        # single seed (uncertainty mechanism doesn't need multi-seed)
    preprocessing:
      n_users_subset: 10000              # same dense core as kaggle (real retriever)
      k_core: 5
    retrievers:
      top_k_candidates: 50
      bpr_mf: { epochs: 50 }
      lightgcn: { epochs: 50 }
    uncertainty:
      uaro: { n_passes: 3 }              # REQUIRED: 3 stochastic passes @ T=0.7 (uncertainty core)
    llm:
      backend: "hf"
      hf_model: "Qwen/Qwen2.5-1.5B-Instruct"  # was 3B: ~2-3x faster on T4 so the full fill finishes in ONE committed session. Still a real, defensible LLM; every method shares it so the comparison holds. Report honestly as Qwen2.5-1.5B-Instruct.
      load_in_4bit: true
      dtype: "bfloat16"
      device: "auto"
      max_new_tokens: 256                # kept at 256 (NOT ~96): the ATM cluster
                                         # ratio clusters the reasoning TRACES, so keep enough
                                         # reasoning length for meaningful semantic clustering
    rerankers:
      uc_asr: { tune_on_val: false }     # skip val grid-search to save a full extra LLM pass
    evaluation:
      figure_dpi: 300                    # keep publication figures (fig3 = uncertainty/gate dist)
      kaggle_unc_max_eval_users: 150     # 150 users: enough to populate the gate tiers + stable stats
      kaggle_unc_max_ablation_users: 60  # ablations run on a smaller user set to save time
    ablations:                           # ONLY the 3 uncertainty-critical ablations (not all 10)
      - name: "no_uncertainty_term"
        desc: "UC-ASR gamma=0 (drop -gamma*U from FinalScore)"
        override: { rerankers: { uc_asr: { gamma: 0.0 } } }
      - name: "no_cluster_ratio_term"
        desc: "UC-ASR beta=0 (drop beta*CR)"
        override: { rerankers: { uc_asr: { beta: 0.0 } } }
      - name: "gate_off_fixed_n3"
        desc: "gate off -> fixed N=3 everywhere (UARO-like)"
        override: {}

  # --- Gemini CPU-laptop-via-API profile: run the WHOLE pipeline on a CPU-only
  #     laptop by calling Google's hosted Gemini API instead of a local GPU model.
  #     The real experiment knobs (10k-user 5-core dense graph, full 50-epoch
  #     BPR-MF + LightGCN, K=50 candidates, N=3 stochastic passes @ T=0.7,
  #     300-DPI figures) are preserved; only the LLM runs remotely so no GPU is
  #     needed. The API key is read ONLY from $GEMINI_API_KEY -- never config.
  gemini:
    project:
      seeds: [42]                        # single seed (the uncertainty mechanism is valid on one seed)
    preprocessing:
      n_users_subset: 10000
      k_core: 5
    retrievers:
      top_k_candidates: 50
      bpr_mf: { epochs: 50 }
      lightgcn: { epochs: 50 }
    uncertainty:
      uaro: { n_passes: 3 }              # REQUIRED: 3 stochastic passes @ T=0.7 (uncertainty core)
    llm:
      backend: "gemini"                  # Google Gemini hosted API (no local GPU)
      gemini_model: "gemini-3.5-flash-lite"
      device: "cpu"
    rerankers:
      uc_asr: { tune_on_val: false }     # skip val grid-search to save API calls
    evaluation:
      figure_dpi: 300
      gemini_max_eval_users: 20          # free-tier DAILY quota is limited, so START SMALL (20);
                                         # raise once a run confirms the daily budget holds, on a
                                         # paid/billing tier, or spread across days (the SQLite
                                         # cache resumes). _resolve_cap picks this up via the
                                         # "*max_eval_users" suffix automatically.
      gemini_max_ablation_users: 10      # tighter cap for the ablations; start small on the
                                         # free-tier daily budget and raise once confirmed/on billing
    ablations:                           # SAME 3 uncertainty-critical ablations as kaggle_unc
      - name: "no_uncertainty_term"
        desc: "UC-ASR gamma=0 (drop -gamma*U from FinalScore)"
        override: { rerankers: { uc_asr: { gamma: 0.0 } } }
      - name: "no_cluster_ratio_term"
        desc: "UC-ASR beta=0 (drop beta*CR)"
        override: { rerankers: { uc_asr: { beta: 0.0 } } }
      - name: "gate_off_fixed_n3"
        desc: "gate off -> fixed N=3 everywhere (UARO-like)"
        override: {}

  # --- Groq CPU-laptop-via-API profile: run the WHOLE pipeline on a CPU-only
  #     laptop by calling Groq's hosted OpenAI-compatible API instead of a local
  #     GPU model. Groq is fast with a generous free tier, so this mirrors the
  #     `gemini` profile's modeling knobs (10k-user 5-core dense graph, full
  #     50-epoch BPR-MF + LightGCN, K=50 candidates, N=3 stochastic passes @
  #     T=0.7, 300-DPI figures) but routes the LLM through Groq. The API key is
  #     read ONLY from $GROQ_API_KEY -- never config.
  groq:
    project:
      seeds: [42]                        # single seed (the uncertainty mechanism is valid on one seed)
    preprocessing:
      n_users_subset: 10000
      k_core: 5
    retrievers:
      top_k_candidates: 50
      bpr_mf: { epochs: 50 }
      lightgcn: { epochs: 50 }
    uncertainty:
      uaro: { n_passes: 3 }              # REQUIRED: 3 stochastic passes @ T=0.7 (uncertainty core)
    llm:
      backend: "groq"                    # Groq hosted OpenAI-compatible API (no local GPU)
      groq_model: "openai/gpt-oss-20b"
      max_new_tokens: 256                # was 128 -> truncated the score; 256 fits full Reasoning+Score without cutting off the number (the 128 cap caused ~45% fallback-3.0 junk).
      device: "cpu"
    rerankers:
      uc_asr: { tune_on_val: false }     # skip val grid-search to save API calls
    evaluation:
      figure_dpi: 300
      groq_max_eval_users: 50            # Groq's free tier is generous, so 50 is reasonable;
                                         # raise once a run confirms the budget holds, or on a
                                         # paid tier (the SQLite cache resumes). _resolve_cap
                                         # picks this up via the "*max_eval_users" suffix.
      groq_max_ablation_users: 20        # tighter cap for the ablations; can be raised likewise
    ablations:                           # SAME 3 uncertainty-critical ablations as gemini/kaggle_unc
      - name: "no_uncertainty_term"
        desc: "UC-ASR gamma=0 (drop -gamma*U from FinalScore)"
        override: { rerankers: { uc_asr: { gamma: 0.0 } } }
      - name: "no_cluster_ratio_term"
        desc: "UC-ASR beta=0 (drop beta*CR)"
        override: { rerankers: { uc_asr: { beta: 0.0 } } }
      - name: "gate_off_fixed_n3"
        desc: "gate off -> fixed N=3 everywhere (UARO-like)"
        override: {}

  # --- CEREBRAS hosted-API profile: run the WHOLE pipeline on a CPU-only
  #     laptop via Cerebras' OpenAI-compatible inference API. Free trial is
  #     ~1,000,000 tokens/DAY (far more generous than Groq's effective cap) at
  #     ~5 RPM with very fast inference, so a full ~3.45M-token 50-user run
  #     finishes in ~3-4 short daily sessions (the SQLite cache resumes), or in
  #     one sitting on the $5 signup credit. Modelling knobs mirror the other
  #     API profiles. The API key is read ONLY from $CEREBRAS_API_KEY.
  cerebras:
    project:
      seeds: [42]                        # single seed (the uncertainty mechanism is valid on one seed)
    preprocessing:
      n_users_subset: 10000
      k_core: 5
    retrievers:
      top_k_candidates: 50
      bpr_mf: { epochs: 50 }
      lightgcn: { epochs: 50 }
    uncertainty:
      uaro: { n_passes: 3 }              # REQUIRED: 3 stochastic passes @ T=0.7 (uncertainty core)
    llm:
      backend: "cerebras"                # Cerebras hosted OpenAI-compatible API (no local GPU)
      cerebras_model: "llama-3.3-70b"
      max_new_tokens: 256                # full Reasoning+Score without truncation; keep >=256 for ATM trace clustering
      device: "cpu"
    rerankers:
      uc_asr: { tune_on_val: false }     # skip val grid-search to save API calls
    evaluation:
      figure_dpi: 300
      cerebras_max_eval_users: 50        # full eval set; the daily token budget comfortably covers this across a session or two. _resolve_cap picks this up via the "*max_eval_users" suffix.
      cerebras_max_ablation_users: 20    # tighter cap for the ablations
    ablations:                           # SAME 3 uncertainty-critical ablations as gemini/groq/local
      - name: "no_uncertainty_term"
        desc: "UC-ASR gamma=0 (drop -gamma*U from FinalScore)"
        override: { rerankers: { uc_asr: { gamma: 0.0 } } }
      - name: "no_cluster_ratio_term"
        desc: "UC-ASR beta=0 (drop beta*CR)"
        override: { rerankers: { uc_asr: { beta: 0.0 } } }
      - name: "gate_off_fixed_n3"
        desc: "gate off -> fixed N=3 everywhere (UARO-like)"
        override: {}

  # --- LOCAL CPU-only profile: run the WHOLE pipeline with NO GPU, NO API, NO
  #     quota. The LLM is a SMALL HuggingFace model on CPU (Qwen2.5-1.5B-Instruct),
  #     which is weak-but-honest: the thesis contribution is the UC-ASR uncertainty
  #     framework, and every method shares the SAME base LLM, so the comparison is
  #     valid. Report the model honestly as a small CPU model. Designed to be left
  #     running overnight; the SQLite cache resumes if interrupted. Modelling knobs
  #     match the API profiles (K=50 candidates, N=3 stochastic passes @ T=0.7,
  #     300-DPI figures) but the user cap is modest so a CPU run finishes overnight.
  local:
    project:
      seeds: [42]                        # single seed (the uncertainty mechanism is valid on one seed)
    preprocessing:
      n_users_subset: 10000
      k_core: 5
    retrievers:
      top_k_candidates: 50
      bpr_mf: { epochs: 50 }
      lightgcn: { epochs: 50 }
    uncertainty:
      uaro: { n_passes: 3 }              # REQUIRED: 3 stochastic passes @ T=0.7 (uncertainty core)
    llm:
      backend: "hf"                      # local HuggingFace transformers on CPU (no GPU, no API)
      hf_model: "Qwen/Qwen2.5-0.5B-Instruct"  # 0.5B: ~3x faster per token than 1.5B on CPU, still gives usable Reasoning+Score. Bump to 1.5B if you want stronger judgments and can spare the extra days.
      load_in_4bit: false                # no CUDA on this machine -> float32 CPU path (NIT-2)
      dtype: "float32"
      device: "cpu"
      max_new_tokens: 96                 # the answer is ~1 sentence + a number; 96 keeps CPU per-call time low while still long enough for ATM trace clustering. Raise toward 256 for richer traces at the cost of more time.
    rerankers:
      uc_asr: { tune_on_val: false }     # skip val grid-search to save a full extra LLM pass
    evaluation:
      figure_dpi: 300
      local_max_eval_users: 8            # OVERNIGHT-sized: ~8 users * ~230 unique calls * ~60s/call ~= a night on CPU. Small sample -> accuracy metrics are noisy; the UC-ASR MECHANISM results (gate tiers, CR, call savings, stability) are the defensible output here. Raise once you have a faster LLM path (e.g. Cerebras). _resolve_cap picks this up via the "*max_eval_users" suffix.
      local_max_ablation_users: 4        # tighter cap for the ablations to keep the overnight run bounded
    ablations:                           # SAME 3 uncertainty-critical ablations as gemini/groq/kaggle_unc
      - name: "no_uncertainty_term"
        desc: "UC-ASR gamma=0 (drop -gamma*U from FinalScore)"
        override: { rerankers: { uc_asr: { gamma: 0.0 } } }
      - name: "no_cluster_ratio_term"
        desc: "UC-ASR beta=0 (drop beta*CR)"
        override: { rerankers: { uc_asr: { beta: 0.0 } } }
      - name: "gate_off_fixed_n3"
        desc: "gate off -> fixed N=3 everywhere (UARO-like)"
        override: {}

# ----------------------------------------------------------------------------
# Ablation studies (config-driven; each toggles ONE UC-ASR component).
# Note: UC-ASR FinalScore = alpha*R + beta*CR + delta*E - gamma*U; lambda is
# UARO-only and NOT part of UC-ASR. Ablation 1 disables the uncertainty term in
# UC-ASR notation by setting rerankers.uc_asr.gamma = 0.
# ----------------------------------------------------------------------------
ablations:
  - name: "no_uncertainty_term"
    desc: "UC-ASR gamma=0 (drop -gamma*U from FinalScore; lambda is UARO-only, N/A here)"
    override: { rerankers: { uc_asr: { gamma: 0.0 } } }
  - name: "no_retrieval_confidence_term"
    desc: "UC-ASR delta=0 (drop delta*E)"
    override: { rerankers: { uc_asr: { delta: 0.0 } } }
  - name: "no_cluster_ratio_term"
    desc: "UC-ASR beta=0 (drop beta*CR)"
    override: { rerankers: { uc_asr: { beta: 0.0 } } }
  - name: "no_confident_freeze_tier"
    desc: "force all candidates through listwise rerank (disable confident freeze)"
    override: { rerankers: { uc_asr: { tau_high: 1.01 } } }
  - name: "no_unstable_deep_tier"
    desc: "disable unstable deep-sampling tier (deep_samples=0)"
    override: { rerankers: { uc_asr: { deep_samples: 0 } } }
  - name: "gate_off_fixed_n3"
    desc: "gate off -> fixed N=3 everywhere (UARO-like)"
    override: {}
  - name: "cr_sbert_only_vs_sbert_nli"
    desc: "CR via SBERT-only vs SBERT+NLI"
    sweep: { uncertainty.atm.use_nli: [false, true] }
  - name: "beta_latent_noise_sensitivity"
    desc: "ATM beta latent-noise sweep (0.25 / 0.5 / 1.0)"
    sweep: { uncertainty.atm.beta: [0.25, 0.5, 1.0] }
  - name: "n_passes_sensitivity"
    desc: "N passes sweep (1 / 3 / 5)"
    sweep: { uncertainty.uaro.n_passes: [1, 3, 5] }
  - name: "tau_threshold_sensitivity"
    desc: "UC-ASR tau threshold sweep (+/- 0.1)"
    sweep: { rerankers.uc_asr.tau_high: [0.65, 0.75, 0.85] }
